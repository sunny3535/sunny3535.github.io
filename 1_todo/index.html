<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 할 일</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .completed { text-decoration: line-through; color: #a0aec0; }
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6">
        <h1 class="text-2xl font-bold text-blue-800 mb-6 text-center">나의 할 일</h1>
        
        <div class="flex gap-2 mb-6">
            <input type="text" id="todoInput" placeholder="할 일 입력..." 
                   class="flex-1 border border-blue-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
            <button onclick="addTodo()" 
                    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">추가하기</button>
        </div>

        <ul id="todoList" class="space-y-2"></ul>
    </div>

    <script>
        const input = document.getElementById('todoInput');
        const list = document.getElementById('todoList');

        // 할 일 추가 함수
        function addTodo() {
            const text = input.value.trim();
            if (!text) return;

            const li = document.createElement('li');
            li.className = "flex items-center justify-between bg-blue-50 p-3 rounded-lg border border-blue-100";
            li.innerHTML = `
                <span class="flex-1 cursor-pointer hover:text-blue-600" onclick="toggleTodo(this)">${text}</span>
                <button onclick="removeTodo(this)" class="text-blue-400 hover:text-red-600 ml-2">삭제</button>
            `;
            list.appendChild(li);
            input.value = '';
        }

        // 취소선 토글 함수
        function toggleTodo(element) {
            element.classList.toggle('completed');
        }

        // 삭제 함수
        function removeTodo(button) {
            button.parentElement.remove();
        }

        // 엔터키 입력 이벤트
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') addTodo();
        });
    </script>
</body>
</html>
